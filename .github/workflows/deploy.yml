name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build all decks + index
        run: |
          set -e
          build_deck () {
            dir="$1"; sub="$2"
            echo "::group::Building $sub"
            ( cd "decks/$dir" \
              && npm ci \
              && npx slidev build --base "/premed-slides/$sub/" --out "$GITHUB_WORKSPACE/dist/$sub" )
            echo "::endgroup::"
          }
          mkdir -p dist
          cp site/index.html dist/index.html
          build_deck 02-macromolecules-carbohydrates carbohydrates
          build_deck 03-macromolecules-lipids        lipids
          build_deck 04-macromolecules-proteins       proteins
          build_deck 01-macromolecules-nucleic-acids  nucleic-acids
          build_deck 05-the-cell                       the-cell
          build_deck 06-cell-membrane-transportation   cell-transportation

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
